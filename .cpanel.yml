---
deployment:
  tasks:
    - /bin/mkdir -p /home/carclub/public_html/storage
    - /bin/cp -f index.php /home/carclub/public_html/
    - /bin/cp -f router.php /home/carclub/public_html/
    - /bin/cp -f .htaccess /home/carclub/public_html/
    - /bin/cp -f README.md /home/carclub/public_html/
    - /bin/cp -f health.php /home/carclub/public_html/
    - /bin/cp -Rf config /home/carclub/public_html/
    - /bin/cp -Rf includes /home/carclub/public_html/
    - /bin/cp -Rf pages /home/carclub/public_html/
    - /bin/cp -Rf admin /home/carclub/public_html/
    - /bin/cp -Rf assets /home/carclub/public_html/
    - /bin/cp -Rf tools /home/carclub/public_html/
    - /bin/cp -f storage/.htaccess /home/carclub/public_html/storage/.htaccess
    - /bin/cp -n storage/cars.json /home/carclub/public_html/storage/cars.json
    - /bin/cp -n storage/site.json /home/carclub/public_html/storage/site.json
    - /bin/chmod 755 /home/carclub/public_html/storage
